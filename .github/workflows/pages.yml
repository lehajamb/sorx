name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify interactive guide
        run: node doc/.interaction-smoke.cjs
      - name: Prepare documentation
        env:
          DOCUMENTATION_COMMIT: ${{ github.sha }}
        run: node doc/.prepare-pages.cjs "$DOCUMENTATION_COMMIT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
